services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    ports: ["9000:9000", "8123:8123"]
    environment:
      CLICKHOUSE_USER: mem
      CLICKHOUSE_PASSWORD: memdev
      CLICKHOUSE_DB: mem
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  dgraph:
    image: dgraph/standalone:latest
    ports: ["18080:8080", "9080:9080"]
    volumes:
      - dgraph:/dgraph
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id BAAI/bge-base-en-v1.5 --port 3000 --hostname 0.0.0.0 --max-client-batch-size 32
    ports: ["3000:3000"]
    volumes:
      - tei_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
  llm:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  chdata:
  dgraph:
  tei_data:
  ollama_data:
