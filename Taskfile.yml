version: '3'

dotenv: ['.env']

vars:
  TEST_ENV: MEM_TEST_CH_ADDR=localhost:9000,MEM_TEST_DGRAPH_ADDR=localhost:9080

tasks:
  build:
    desc: Build all binaries
    cmds:
      - go build ./...

  test:
    desc: Run unit tests (no databases required)
    cmds:
      - go test ./...

  itest:
    desc: Run the full suite against live ClickHouse + Dgraph
    deps: [db-up]
    cmds:
      - go test -count=1 -p 1 ./...
    env:
      MEM_TEST_CH_ADDR: localhost:9000
      MEM_TEST_DGRAPH_ADDR: localhost:9080

  db-up:
    desc: Start the dev stack (ClickHouse + Dgraph + embedder), waits for health
    cmds:
      - docker compose up -d --wait clickhouse dgraph embedder

  db-down:
    desc: Stop the stack and wipe volumes
    cmds:
      - docker compose down -v

  run:
    desc: Run the memory service API (dev port :8090 — 8080 is taken by another app)
    env:
      MEM_LISTEN_ADDR: localhost:8090
    cmds:
      - go run ./cmd/memserved

  stop:
    desc: Stop any running memserved (frees :8090)
    cmds:
      - ps aux | grep '[m]emserved' | awk '{print $2}' | xargs -r kill; sleep 1; echo "stopped (if it was running)"

  swagger:
    desc: Regenerate OpenAPI spec from handler annotations
    cmds:
      - swag fmt
      - swag init --parseDependency --parseInternal -g cmd/memserved/main.go -o docs

  seed:
    desc: Backfill seeds/smoke.jsonl into the running service's ClickHouse
    cmds:
      - go run ./cmd/memseed -file seeds/smoke.jsonl

  eval:
    desc: Run recall@k evals (exits 1 on regression)
    cmds:
      - go run ./cmd/memeval

  demo-seed:
    desc: Ingest the PHANTOM PORTAL synthetic investigation (3 teams + agents + facts)
    cmds:
      - go run ./cmd/memseed -file seeds/phantom-portal/observations.jsonl -facts seeds/phantom-portal/facts.jsonl

  run-extract:
    desc: "Run the service with dreaming-lite extraction enabled (stop any existing instance first via task stop)"
    env:
      MEM_EXTRACT_ENABLED: "true"
      MEM_LISTEN_ADDR: localhost:8090
    cmds:
      - go run ./cmd/memserved

  mcp:
    desc: Build memmcp for local stdio use
    cmds:
      - go build -o memmcp ./cmd/memmcp

  install-skills:
    desc: Install repo skills for development (symlink by default; --copy to copy instead)
    cmds:
      - |
        MODE="symlink"
        for arg in {{.CLI_ARGS}}; do [ "$arg" = "--copy" ] && MODE="copy" && break; done
        DEST_BASE=""
        if [ -d "$HOME/.agents/skills" ]; then DEST_BASE="$HOME/.agents/skills"
        elif [ -d "$HOME/.config/opencode/skills" ]; then DEST_BASE="$HOME/.config/opencode/skills"
        else DEST_BASE="$HOME/.agents/skills"; mkdir -p "$DEST_BASE"; fi
        for src in skills/*; do
          [ -d "$src" ] || continue
          name=$(basename "$src")
          dest="$DEST_BASE/$name"
          rm -rf "$dest"
          if [ "$MODE" = "copy" ]; then cp -r "$src" "$dest"; echo "installed (copy) $name -> $dest"
          else ln -s "$(pwd)/$src" "$dest"; echo "installed (symlink) $name -> $dest"; fi
        done

  uninstall-skills:
    desc: Remove repo skills from the global skills dir
    cmds:
      - |
        for dest_base in "$HOME/.agents/skills" "$HOME/.config/opencode/skills"; do
          for src in skills/*; do
            [ -d "$src" ] || continue
            name=$(basename "$src")
            dest="$dest_base/$name"
            # only remove if it points at this repo (symlink) or was copied from it
            if [ -L "$dest" ] && [ "$(readlink "$dest")" = "$(pwd)/$src" ]; then rm "$dest" && echo "removed $dest (symlink)"; fi
            # for copied installs, check a marker file to avoid deleting unrelated skills
            if [ ! -L "$dest" ] && [ -f "$dest/SKILL.md" ] && grep -q "soc-memory" "$dest/SKILL.md" 2>/dev/null; then
              # extra guard: only if this skill came from this repo's soc-memory
              case "$name" in soc-memory) rm -rf "$dest" && echo "removed $dest (copy)" ;; esac
            fi
          done
        done
        echo "done"

  package-skills:
    desc: Package repo skills into .skill files (uses skill-creator's packager)
    cmds:
      - |
        OUT="${1:-dist}"; [ -n "{{.CLI_ARGS}}" ] && OUT="{{.CLI_ARGS}}"
        mkdir -p "$OUT"
        for src in skills/*; do
          [ -d "$src" ] || continue
          python3 ~/.agents/skills/skill-creator/scripts/package_skill.py "$src" "$OUT" 2>&1 | tail -5
        done
