version: '3'

vars:
  TEST_ENV: MEM_TEST_CH_ADDR=localhost:9000,MEM_TEST_DGRAPH_ADDR=localhost:9080

tasks:
  build:
    desc: Build all binaries
    cmds:
      - go build ./...

  test:
    desc: Run unit tests (no databases required)
    cmds:
      - go test ./...

  itest:
    desc: Run the full suite against live ClickHouse + Dgraph
    deps: [db-up]
    cmds:
      - go test -count=1 -p 1 ./...
    env:
      MEM_TEST_CH_ADDR: localhost:9000
      MEM_TEST_DGRAPH_ADDR: localhost:9080

  db-up:
    desc: Start the dev stack (ClickHouse + Dgraph + embedder), waits for health
    cmds:
      - docker compose up -d --wait clickhouse dgraph embedder

  db-down:
    desc: Stop the stack and wipe volumes
    cmds:
      - docker compose down -v

  run:
    desc: Run the memory service API (dev port :8090 — 8080 is taken by another app)
    env:
      MEM_LISTEN_ADDR: localhost:8090
    cmds:
      - go run ./cmd/memserved

  stop:
    desc: Stop any running memserved (frees :8090)
    cmds:
      - ps aux | grep '[m]emserved' | awk '{print $2}' | xargs -r kill; sleep 1; echo "stopped (if it was running)"

  swagger:
    desc: Regenerate OpenAPI spec from handler annotations
    cmds:
      - swag fmt
      - swag init --parseDependency --parseInternal -g cmd/memserved/main.go -o docs

  seed:
    desc: Backfill seeds/smoke.jsonl into the running service's ClickHouse
    cmds:
      - go run ./cmd/memseed -file seeds/smoke.jsonl

  eval:
    desc: Run recall@k evals (exits 1 on regression)
    cmds:
      - go run ./cmd/memeval

  demo-seed:
    desc: Ingest the PHANTOM PORTAL synthetic investigation (3 teams + agents + facts)
    cmds:
      - go run ./cmd/memseed -file seeds/phantom-portal/observations.jsonl -facts seeds/phantom-portal/facts.jsonl

  run-extract:
    desc: "Run the service with dreaming-lite extraction enabled (stop any existing instance first via task stop)"
    env:
      MEM_EXTRACT_ENABLED: "true"
      MEM_EXTRACT_MODEL: qwen/qwen3-8b
      MEM_LISTEN_ADDR: localhost:8090
    cmds:
      - go run ./cmd/memserved

  mcp:
    desc: Build memmcp for local stdio use
    cmds:
      - go build -o memmcp ./cmd/memmcp
